<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="myTravel" viewBox="-4.2 -125.61 894.58 199.11" width="539.1" height="120">
<title>myTravel</title>
<desc>Логотип myTravel. Зацикленный индикатор ожидания: самолёт бесконечно идёт по взлётной полосе, за ним подтягивается гранатовая полоса. Слово статично.</desc>
<style>
  .mtl-runway path{fill:none;stroke:#a81e2d;stroke-width:23;stroke-linecap:round}
  .mtl-track{opacity:.22}
  .mtl-trail{animation-duration:2s;animation-timing-function:linear;animation-iteration-count:infinite}
  .mtl-t1{stroke-dasharray:560 440;stroke-dashoffset:560;opacity:.28;animation-name:mtl-d1}
  .mtl-t2{stroke-dasharray:300 700;stroke-dashoffset:300;opacity:.5;animation-name:mtl-d2}
  .mtl-t3{stroke-dasharray:120 880;stroke-dashoffset:120;opacity:1;animation-name:mtl-d3}
  .mtl-plane{fill:#a81e2d;opacity:0;transform-box:fill-box;transform-origin:50% 50%;
    animation:mtl-fly 2s linear infinite,mtl-lift 2s linear infinite}
  .mtl-word{fill:#2a211c}

  @keyframes mtl-d1{from{stroke-dashoffset:560}to{stroke-dashoffset:-440}}
  @keyframes mtl-d2{from{stroke-dashoffset:300}to{stroke-dashoffset:-700}}
  @keyframes mtl-d3{from{stroke-dashoffset:120}to{stroke-dashoffset:-880}}
  @keyframes mtl-lift{
    0%{opacity:0} 3%{opacity:.4} 8%{opacity:1}
    86%{opacity:1} 93%{opacity:.5} 100%{opacity:0}
  }
  @keyframes mtl-fly{
0% { transform: translate(-776.39px,125.5px) rotate(39.52deg) scale(1) }
  73.871% { transform: translate(-173.88px,125.5px) rotate(39.52deg) scale(1) }
  75.059% { transform: translate(-164.17px,123.47px) rotate(36.9deg) scale(1) }
  76.246% { transform: translate(-154.58px,120.7px) rotate(33.89deg) scale(1) }
  77.434% { transform: translate(-145.19px,117.13px) rotate(30.49deg) scale(1) }
  78.622% { transform: translate(-136.07px,112.77px) rotate(26.77deg) scale(1) }
  79.809% { transform: translate(-127.29px,107.67px) rotate(22.85deg) scale(1) }
  80.997% { transform: translate(-118.89px,101.96px) rotate(18.91deg) scale(1) }
  82.185% { transform: translate(-110.85px,95.81px) rotate(15.14deg) scale(1) }
  83.373% { transform: translate(-103.12px,89.39px) rotate(11.72deg) scale(1) }
