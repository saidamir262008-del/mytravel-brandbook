  85.748% { transform: translate(-88.25px,76.21px) rotate(6.28deg) scale(1) }
  86.936% { transform: translate(-80.98px,69.59px) rotate(4.3deg) scale(1) }
  88% { transform: translate(-74.49px,63.68px) rotate(2.89deg) scale(1) }
  88.123% { transform: translate(-73.74px,63px) rotate(2.75deg) scale(0.9985) }
  89.311% { transform: translate(-66.51px,56.46px) rotate(1.58deg) scale(0.9836) }
  90.499% { transform: translate(-59.26px,49.97px) rotate(0.73deg) scale(0.9688) }
  91.686% { transform: translate(-51.99px,43.53px) rotate(0.14deg) scale(0.9539) }
  92.874% { transform: translate(-44.69px,37.15px) rotate(-0.24deg) scale(0.9391) }
  94.062% { transform: translate(-37.35px,30.82px) rotate(-0.46deg) scale(0.9242) }
  95.249% { transform: translate(-29.96px,24.55px) rotate(-0.54deg) scale(0.9094) }
  96.437% { transform: translate(-22.54px,18.33px) rotate(-0.51deg) scale(0.8945) }
  97.625% { transform: translate(-15.07px,12.17px) rotate(-0.4deg) scale(0.8797) }
  98.812% { transform: translate(-7.55px,6.06px) rotate(-0.22deg) scale(0.8648) }
  100% { transform: translate(0px,0px) rotate(0deg) scale(0.85) }
  }

  /* Покой: полная полоса, самолёт дома — кадр в кадр исходный логотип. */
  @media (prefers-reduced-motion:reduce){
    .mtl-track{opacity:1}
    .mtl-trail{display:none}
    .mtl-plane{animation:none;opacity:1;transform:none}
  }
  .mtl-still .mtl-track{opacity:1}
  .mtl-still .mtl-trail{display:none}
  .mtl-still .mtl-plane{animation:none;opacity:1;transform:none}
</style>
